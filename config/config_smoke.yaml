# Tiny, deterministic config for plumbing checks only.
# This intentionally does not change the default physics-production config.
signal:
  name: "Lb2LambdaGamma"
  evt_gen_file : "evtgen/Lb2LambdaGamma.dec"
  evt_gen_label: Lambda_b0_SIGNAL
  evt_gen_pid : 5122
  pdg_mother  : 5122
  # Stable daughters of Lb -> Lambda0(-> p pi) gamma
  # (for anti-Lb, charge conjugation is handled in the analysis selection)
  pdg_daughters: [2212, -211, 22]

env:
  # For the smoke test, source Key4hep/FCCAnalyses in the parent shell as
  # documented in README.md. Leave these empty to avoid changing that shell.
  key4hep_setup: ""
  key4hep_args:  ""
  fccanalyses_setup: ""

analysis:
  # Use reco mode because the default plot branch is lb_reco_m.
  mode: "reco"

# Keep backgrounds disabled so the smoke test only produces the tiny signal chain.
backgrounds: []

production:
  ecm_gev: 91.0
  nevents: 10
  seed: 24680

urls:
  # FCC-config cards (winter2023) used in the FCC fast-sim tutorial
  pythia_cmd: "https://raw.githubusercontent.com/HEP-FCC/FCC-config/winter2023/FCCee/Generator/Pythia8/p8_ee_Zbb_ecm91_EVTGEN.cmd"
  delphes_card: "https://raw.githubusercontent.com/HEP-FCC/FCC-config/winter2023/FCCee/Delphes/card_IDEA.tcl"
  edm4hep_tcl: "https://raw.githubusercontent.com/HEP-FCC/FCC-config/winter2023/FCCee/Delphes/edm4hep_IDEA.tcl"
  decay_dec: "https://raw.githubusercontent.com/HEP-FCC/FCC-config/winter2023/FCCee/Generator/EvtGen/DECAY.DEC"
  evt_pdl: "https://raw.githubusercontent.com/HEP-FCC/FCC-config/winter2023/FCCee/Generator/EvtGen/evt.pdl"

paths:
  delphes_out: "outputs/delphes/smoke_Lb2LambdaGamma_IDEA_edm4hep.root"
  analysis_dir: "outputs/analysis/smoke"
  plots_dir: "outputs/plots/smoke"

resources:
  analysis_cores: 1

plot:
  branch: "lb_reco_m"
  nbins: 120
  xmin: 4.8
  xmax: 6.4
  normalize: "none"
  signal_scale: 1.0
